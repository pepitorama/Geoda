<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0a14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>GEODA — Defiende el Núcleo</title>
<style>
  :root {
    --bg: #0b0a14;
    --panel: rgba(18, 16, 34, 0.92);
    --border: rgba(140, 120, 255, 0.25);
    --text: #e8e4ff;
    --dim: #9a92c9;
    --accent: #8c78ff;
    --danger: #ff5470;
    --ok: #52e5a5;
    --gold: #ffc94a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
  button { font-family: inherit; }

  /* ---------- HUD superior ---------- */
  #hud-top {
    position: fixed; top: 12px; left: 0; right: 0; margin: 0 auto; width: fit-content;
    display: flex; gap: 14px; align-items: center; pointer-events: none;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 18px;
    box-shadow: 0 4px 24px rgba(0,0,0,.5); z-index: 10;
  }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
  .stat .icon { font-size: 17px; }
  .stat .val { min-width: 30px; }
  #core-bar-wrap {
    position: relative;
    width: 140px; height: 14px; border-radius: 7px;
    background: rgba(255,255,255,.08); overflow: hidden;
    border: 1px solid var(--border);
  }
  #core-hp-num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7);
    pointer-events: none;
  }
  #ui-relics { font-size: 15px; letter-spacing: 1px; }
  #core-bar {
    height: 100%; width: 100%; border-radius: 6px;
    background: linear-gradient(90deg, #52e5a5, #4ad9e8);
    transition: width .25s ease, background .3s ease;
  }

  /* ---------- Barra de progreso de oleada ---------- */
  #wave-progress-wrap {
    position: fixed; top: 62px; left: 0; right: 0; margin: 0 auto;
    width: 280px; display: none; z-index: 10; pointer-events: none;
    text-align: center;
  }
  #wave-progress-track {
    height: 6px; border-radius: 3px; background: rgba(255,255,255,.08);
    border: 1px solid var(--border); overflow: hidden;
  }
  #wave-progress-bar {
    height: 100%; width: 100%; background: linear-gradient(90deg, #8c78ff, #b06df0);
    transition: width .3s ease;
  }
  #wave-progress-label { font-size: 11px; color: var(--dim); margin-top: 3px; font-weight: 600; }

  #help-btn {
    position: fixed; top: 14px; right: 14px; z-index: 11;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--dim); font-size: 17px; font-weight: 800; cursor: pointer;
    transition: transform .12s ease, color .15s;
  }
  #help-btn:hover { transform: scale(1.1); color: var(--text); }
  #help-btn:active { transform: scale(.9); }
  #speed-btn {
    position: fixed; top: 14px; right: 58px; z-index: 11;
    height: 36px; min-width: 44px; padding: 0 12px; border-radius: 18px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--dim); font-size: 14px; font-weight: 800; cursor: pointer;
    transition: transform .12s ease, color .15s, border-color .15s;
    display: none;
  }
  #speed-btn:hover { transform: scale(1.05); color: var(--text); }
  #speed-btn:active { transform: scale(.92); }
  #speed-btn.fast { color: var(--gold); border-color: rgba(255,201,74,.5); box-shadow: 0 0 12px rgba(255,201,74,.2); }

  /* ---------- Barra inferior ---------- */
  #toolbar {
    position: fixed; bottom: 14px; left: 0; right: 0; margin: 0 auto; width: fit-content;
    display: flex; gap: 8px; padding: 9px; align-items: stretch;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: 0 6px 30px rgba(0,0,0,.55);
    max-width: 97vw; flex-wrap: wrap; justify-content: center; z-index: 10;
  }
  .tb-divider { width: 1px; background: var(--border); margin: 4px 3px; }
  .tower-btn, .ability-btn {
    pointer-events: auto; cursor: pointer; position: relative;
    width: 72px; padding: 7px 4px 6px;
    background: rgba(255,255,255,.04);
    border: 2px solid transparent; border-radius: 12px;
    text-align: center; color: var(--text);
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
  }
  .tower-btn:hover, .ability-btn:hover { transform: translateY(-3px); background: rgba(255,255,255,.09); }
  .tower-btn:active, .ability-btn:active { transform: translateY(-1px) scale(.95); }
  .tower-btn.selected {
    border-color: var(--accent); background: rgba(140,120,255,.18);
    box-shadow: 0 0 0 1px rgba(140,120,255,.35), 0 -3px 14px rgba(140,120,255,.28);
  }
  .tower-btn.locked, .ability-btn.locked { opacity: .35; cursor: not-allowed; }
  .tower-btn.cant { opacity: .78; }
  .tower-btn.cant .cost { color: var(--danger); }
  .tower-btn .gem, .ability-btn .gem { font-size: 22px; line-height: 1.1; filter: drop-shadow(0 0 6px currentColor); transition: transform .12s ease; }
  .tower-btn:hover .gem, .ability-btn:hover .gem { transform: scale(1.12); }
  .tower-btn .name, .ability-btn .name { font-size: 11px; font-weight: 700; margin-top: 2px; }
  .tower-btn .cost, .ability-btn .cost { font-size: 10.5px; color: var(--dim); margin-top: 1px; }
  .tower-btn .key, .ability-btn .key {
    position: absolute; top: 3px; left: 5px; font-size: 9px; font-weight: 700;
    color: var(--dim); background: rgba(255,255,255,.06);
    border-radius: 4px; padding: 0 3px; line-height: 1.5;
  }
  /* Recarga radial estilo juego (conic-gradient) sobre las habilidades */
  .ability-btn { border-color: rgba(82,229,165,.28); }
  .ability-btn::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    pointer-events: none; opacity: 0; transition: opacity .2s;
    background: conic-gradient(from -90deg, rgba(6,5,16,.6) calc(var(--cd, 0) * 360deg), transparent 0);
  }
  .ability-btn.cooling::after { opacity: 1; }
  .ability-btn.cooling { opacity: .82; }
  .ability-btn.ready { border-color: rgba(82,229,165,.6); box-shadow: 0 0 12px rgba(82,229,165,.18); }
  .ability-btn.ready .gem { animation: pulse-glow 1.6s infinite; }
  @keyframes pulse-glow { 50% { filter: drop-shadow(0 0 12px currentColor); } }
  @keyframes shake-x { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .shake { animation: shake-x .18s 2; }

  /* ---------- Oleadas ---------- */
  #wave-banner {
    position: fixed; top: 36%; left: 0; right: 0;
    font-size: 44px; font-weight: 800; letter-spacing: 3px;
    text-shadow: 0 0 30px var(--accent), 0 2px 10px rgba(0,0,0,.6);
    opacity: 0; pointer-events: none; transition: opacity .4s ease;
    text-align: center; z-index: 12;
  }
  #wave-banner .sub { font-size: 16px; font-weight: 500; color: var(--dim); letter-spacing: 1px; }
  #wave-banner.show { opacity: 1; }

  #next-wave-btn {
    position: fixed; bottom: 128px; left: 0; right: 0; margin: 0 auto; width: fit-content;
    pointer-events: auto; cursor: pointer;
    padding: 10px 26px; font-size: 15px; font-weight: 700;
    color: #fff; background: linear-gradient(135deg, #8c78ff, #5a48d6);
    border: none; border-radius: 999px;
    box-shadow: 0 4px 20px rgba(140,120,255,.45);
    display: none; z-index: 10;
    transition: transform .12s ease;
  }
  #next-wave-btn:hover { transform: translateY(-2px); }
  #wave-preview {
    position: fixed; bottom: 178px; left: 0; right: 0; margin: 0 auto; width: fit-content;
    display: none; z-index: 10; pointer-events: none;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 14px; font-size: 13px;
    color: var(--dim); text-align: center; max-width: 92vw;
  }
  #wave-preview .ico { font-weight: 800; margin: 0 4px; }
  #wave-preview .mut { color: var(--gold); font-weight: 700; }

  /* ---------- Tooltip ---------- */
  #tooltip {
    position: fixed; pointer-events: none; display: none;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; font-size: 12px;
    max-width: 250px; z-index: 30; box-shadow: 0 4px 18px rgba(0,0,0,.5);
  }
  #tooltip b { color: var(--accent); }
  #tooltip .row { color: var(--dim); margin-top: 2px; }

  /* ---------- Popup de torre ---------- */
  #tower-popup {
    position: fixed; display: none; z-index: 32;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.6);
    max-width: 250px;
  }
  #tower-popup button {
    display: block; width: 100%; margin: 4px 0; padding: 8px 12px;
    background: rgba(255,255,255,.06); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 12.5px; font-weight: 600; cursor: pointer; text-align: left;
  }
  #tower-popup button:hover { background: rgba(140,120,255,.15); }
  #tower-popup button:disabled { opacity: .4; cursor: not-allowed; }
  #tower-popup .evo-desc { font-size: 10.5px; color: var(--dim); font-weight: 400; margin-top: 2px; }

  /* ---------- Toasts ---------- */
  #toasts {
    position: fixed; top: 70px; right: 14px; z-index: 40;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .toast {
    display: flex; gap: 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    border-radius: 10px; padding: 9px 14px; min-width: 220px;
    box-shadow: 0 4px 18px rgba(0,0,0,.5);
    animation: toast-in .3s ease;
  }
  .toast.out { opacity: 0; transform: translateX(20px); transition: all .4s ease; }
  .toast .t-icon { font-size: 22px; }
  .toast .t-title { font-size: 13px; font-weight: 800; }
  .toast .t-sub { font-size: 11.5px; color: var(--dim); }
  @keyframes toast-in { from { opacity: 0; transform: translateX(30px); } }

  /* ---------- Tutorial ---------- */
  #tutorial {
    position: fixed; bottom: 235px; left: 0; right: 0; margin: 0 auto; width: fit-content;
    max-width: 440px; z-index: 24; display: none;
    background: var(--panel); border: 1px solid rgba(255,201,74,.5);
    border-radius: 12px; padding: 12px 16px; font-size: 13.5px; line-height: 1.5;
    box-shadow: 0 6px 24px rgba(0,0,0,.6); text-align: center; color: var(--text);
  }
  #tutorial b { color: var(--gold); }
  #tutorial .tut-skip {
    display: inline-block; margin-top: 6px; font-size: 11px; color: var(--dim);
    cursor: pointer; pointer-events: auto; text-decoration: underline;
  }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(8, 7, 18, 0.88); backdrop-filter: blur(6px);
    text-align: center; padding: 24px;
  }
  .overlay h1 {
    font-size: 50px; letter-spacing: 6px; font-weight: 900;
    background: linear-gradient(135deg, #b9a8ff, #6ee7d8, #b9a8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px rgba(140,120,255,.5));
  }
  .overlay h2 { font-size: 34px; margin-bottom: 8px; }
  .overlay h3 { font-size: 15px; letter-spacing: 1px; color: var(--dim); margin: 14px 0 8px; text-transform: uppercase; }
  .overlay p { color: var(--dim); font-size: 14px; line-height: 1.6; max-width: 560px; }
  .overlay p b { color: var(--text); }
  .big-btn {
    margin-top: 14px; cursor: pointer;
    padding: 12px 34px; font-size: 15px; font-weight: 800; letter-spacing: 1px;
    color: #fff; background: linear-gradient(135deg, #8c78ff, #5a48d6);
    border: none; border-radius: 999px;
    box-shadow: 0 6px 28px rgba(140,120,255,.5);
    transition: transform .15s ease;
  }
  .big-btn:hover { transform: scale(1.05); }
  .big-btn.secondary { background: rgba(255,255,255,.08); border: 1px solid var(--border); box-shadow: none; }
  .big-btn.gold { background: linear-gradient(135deg, #ffc94a, #ff9a3c); box-shadow: 0 6px 28px rgba(255,201,74,.4); }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .hidden { display: none !important; }

  /* ---------- Menú ---------- */
  #menu .tagline { font-size: 17px; color: var(--text); margin: 4px 0 2px; }
  #meta-row { margin: 8px 0 4px; font-size: 14px; color: var(--dim); }
  #meta-row b { color: var(--gold); }
  #menu-columns {
    display: flex; gap: 30px; margin-top: 10px; flex-wrap: wrap;
    justify-content: center; align-items: flex-start; max-width: 940px;
  }
  .menu-col { min-width: 300px; max-width: 430px; }
  #difficulty-row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .diff-btn {
    cursor: pointer; padding: 8px 16px; font-size: 13px; font-weight: 700;
    background: rgba(255,255,255,.05); color: var(--dim);
    border: 2px solid transparent; border-radius: 10px;
    transition: all .15s ease;
  }
  .diff-btn.selected { color: var(--text); border-color: currentColor; }
  #shop-grid { display: flex; flex-direction: column; gap: 6px; }
  .shop-item {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px;
  }
  .shop-item .s-icon { font-size: 20px; }
  .shop-item .s-body { flex: 1; }
  .shop-item .s-name { font-size: 13px; font-weight: 700; }
  .shop-item .s-desc { font-size: 11px; color: var(--dim); }
  .shop-item .s-pips { font-size: 10px; letter-spacing: 2px; color: var(--gold); }
  .shop-item button {
    cursor: pointer; padding: 6px 12px; font-size: 12px; font-weight: 700;
    background: rgba(255,201,74,.12); color: var(--gold);
    border: 1px solid rgba(255,201,74,.4); border-radius: 8px;
    white-space: nowrap;
  }
  .shop-item button:disabled { opacity: .35; cursor: not-allowed; }
  #ach-grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .ach {
    width: 40px; height: 40px; border-radius: 10px; font-size: 19px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    cursor: help; position: relative;
  }
  .ach.locked { opacity: .25; filter: grayscale(1); }
  .ach.done { border-color: rgba(255,201,74,.5); box-shadow: 0 0 10px rgba(255,201,74,.2); }
  #history-list { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); }
  #history-list .h-row {
    display: flex; justify-content: space-between; gap: 10px;
    background: rgba(255,255,255,.03); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px;
  }
  #history-list .h-row b { color: var(--text); }

  /* ---------- Final / victoria ---------- */
  #gameover h2 { color: var(--danger); text-shadow: 0 0 30px rgba(255,84,112,.6); }
  #victory h2 { color: var(--gold); text-shadow: 0 0 30px rgba(255,201,74,.6); }
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px; margin: 12px 0; max-width: 560px; width: 100%;
  }
  .stats-grid .sg {
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 6px;
  }
  .stats-grid .sg .n { font-size: 18px; font-weight: 800; color: var(--accent); }
  .stats-grid .sg .l { font-size: 10.5px; color: var(--dim); margin-top: 2px; }
  .frags-earned { font-size: 15px; color: var(--gold); font-weight: 700; margin-top: 2px; }
  .chart-box {
    background: rgba(255,255,255,.03); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px 6px; margin-top: 8px; max-width: 560px; width: 100%;
  }
  .chart-box .c-title { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .chart-box canvas { width: 100%; height: auto; display: block; }
  .dmg-bars { max-width: 560px; width: 100%; margin-top: 8px; text-align: left; }
  .dmg-bars .db-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; margin: 3px 0; color: var(--dim); }
  .dmg-bars .db-name { width: 86px; text-align: right; }
  .dmg-bars .db-track { flex: 1; height: 9px; border-radius: 5px; background: rgba(255,255,255,.06); overflow: hidden; }
  .dmg-bars .db-fill { height: 100%; border-radius: 5px; }
  .dmg-bars .db-val { width: 60px; }

  /* ---------- Draft de reliquias ---------- */
  #draft { z-index: 55; }
  #draft-cards { display: flex; gap: 14px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  .draft-card {
    width: 180px; padding: 18px 14px; cursor: pointer;
    background: linear-gradient(160deg, rgba(140,120,255,.12), rgba(18,16,34,.9));
    border: 2px solid var(--border); border-radius: 16px;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .draft-card:hover {
    transform: translateY(-6px) scale(1.03);
    border-color: var(--gold);
    box-shadow: 0 10px 30px rgba(255,201,74,.25);
  }
  .draft-card .d-icon { font-size: 38px; filter: drop-shadow(0 0 12px rgba(255,201,74,.5)); }
  .draft-card .d-name { font-size: 14.5px; font-weight: 800; margin-top: 8px; }
  .draft-card .d-desc { font-size: 11.5px; color: var(--dim); margin-top: 6px; line-height: 1.45; }

  /* ---------- Editor ---------- */
  #editor-panel {
    position: fixed; top: 70px; left: 14px; z-index: 20; width: 172px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.55);
  }
  #editor-panel .ep-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
  #editor-panel .ep-hint { font-size: 10.5px; color: var(--dim); margin-bottom: 8px; line-height: 1.4; }
  #editor-panel .ep-tools { display: flex; gap: 6px; margin-bottom: 8px; }
  #editor-panel .ep-tool {
    flex: 1; padding: 6px 4px; font-size: 11px; font-weight: 700; cursor: pointer;
    background: rgba(255,255,255,.05); color: var(--dim);
    border: 2px solid transparent; border-radius: 8px;
  }
  #editor-panel .ep-tool.selected { color: var(--text); border-color: var(--accent); }
  #editor-panel .ep-size { display: block; font-size: 11px; color: var(--dim); margin-bottom: 8px; }
  #editor-panel .ep-size input { width: 100%; accent-color: var(--accent); }
  #editor-panel .ep-actions { display: flex; flex-direction: column; gap: 5px; }
  #editor-panel .ep-actions button {
    padding: 7px; font-size: 11.5px; font-weight: 700; cursor: pointer;
    background: rgba(255,255,255,.06); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  #editor-panel .ep-actions button:hover { background: rgba(140,120,255,.15); }

  /* ---------- Campaña ---------- */
  #campaign-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px; margin-top: 16px; max-width: 700px; width: 100%;
  }
  .camp-card {
    padding: 14px 12px; cursor: pointer; text-align: center;
    background: linear-gradient(160deg, rgba(140,120,255,.1), rgba(18,16,34,.9));
    border: 2px solid var(--border); border-radius: 14px;
    transition: transform .15s ease, border-color .15s ease;
  }
  .camp-card:hover { transform: translateY(-4px); border-color: var(--gold); }
  .camp-card.locked { opacity: .38; cursor: not-allowed; filter: grayscale(.6); }
  .camp-card.locked:hover { transform: none; border-color: var(--border); }
  .camp-card .cc-icon { font-size: 30px; }
  .camp-card .cc-name { font-size: 13.5px; font-weight: 800; margin-top: 6px; }
  .camp-card .cc-stars { font-size: 15px; color: var(--gold); letter-spacing: 2px; margin-top: 3px; }
  .camp-card .cc-desc { font-size: 11px; color: var(--dim); margin-top: 5px; line-height: 1.4; min-height: 30px; }
  .camp-card .cc-waves { font-size: 10.5px; color: var(--accent); margin-top: 4px; font-weight: 700; }
  #victory-stars-row { font-size: 42px; color: var(--gold); letter-spacing: 8px; text-shadow: 0 0 24px rgba(255,201,74,.6); margin: 4px 0; }

  /* ---------- Ajustes ---------- */
  #settings .set-box { width: 340px; max-width: 92vw; text-align: left; margin-top: 6px; }
  .set-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 14px; margin: 6px 0; font-size: 13px;
  }
  .set-row select, .set-row input[type=range] { accent-color: var(--accent); }
  .set-row select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 6px; font-family: inherit;
  }
  .switch { position: relative; width: 40px; height: 22px; cursor: pointer; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .sl {
    position: absolute; inset: 0; border-radius: 999px;
    background: rgba(255,255,255,.12); transition: background .15s;
  }
  .switch .sl::before {
    content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
    left: 3px; top: 3px; background: #fff; transition: transform .15s;
  }
  .switch input:checked + .sl { background: var(--accent); }
  .switch input:checked + .sl::before { transform: translateX(18px); }

  /* ---------- Ayuda ---------- */
  #help { justify-content: flex-start; padding-top: 46px; }
  #help .help-box {
    max-width: 640px; text-align: left; font-size: 13px; line-height: 1.7; color: var(--dim);
  }
  #help .help-box b { color: var(--text); }
  #help .help-box h3 { text-align: center; }
  #help kbd, #tutorial kbd {
    background: rgba(255,255,255,.08); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 7px; font-size: 11px; color: var(--text);
    font-family: inherit;
  }

  @media (max-width: 900px) {
    #next-wave-btn { bottom: 218px; }
    #wave-preview { bottom: 266px; }
    #tutorial { bottom: 320px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud-top">
  <div class="stat"><span class="icon">💎</span><span class="val" id="ui-energy">0</span></div>
  <div class="stat"><span class="icon">🌊</span><span class="val" id="ui-wave">0</span></div>
  <div class="stat"><span class="icon">⭐</span><span class="val" id="ui-score">0</span></div>
  <div class="stat" id="ui-combo-wrap" style="display:none;"><span class="icon">🔥</span><span class="val" id="ui-combo">x1</span></div>
  <div class="stat" id="ui-relics-wrap" style="display:none;"><span class="icon">🃏</span><span class="val" id="ui-relics">0</span></div>
  <div class="stat"><span class="icon">💠</span><span class="val" id="ui-frags">0</span></div>
  <div class="stat"><span class="icon">🔮</span>
    <div id="core-bar-wrap"><div id="core-bar"></div><span id="core-hp-num"></span></div>
  </div>
</div>

<div id="wave-progress-wrap">
  <div id="wave-progress-track"><div id="wave-progress-bar"></div></div>
  <div id="wave-progress-label"></div>
</div>

<button id="help-btn" title="Ayuda (H)">?</button>
<button id="speed-btn" title="Velocidad (F)">1×</button>

<div id="toolbar"></div>

<div id="wave-banner"></div>
<div id="wave-preview"></div>
<button id="next-wave-btn">▶</button>
<div id="tooltip"></div>
<div id="tower-popup"></div>
<div id="toasts"></div>
<div id="tutorial"></div>

<div id="editor-panel" class="hidden">
  <div class="ep-title" data-i18n="editorBtn"></div>
  <div class="ep-hint" data-i18n="editorHint"></div>
  <div class="ep-tools">
    <button id="ep-rock" class="ep-tool selected" data-i18n="editorRock"></button>
    <button id="ep-spot" class="ep-tool" data-i18n="editorSpot"></button>
  </div>
  <label class="ep-size"><span data-i18n="editorSize"></span>
    <input type="range" id="ep-size" min="22" max="60" value="40">
  </label>
  <div class="ep-actions">
    <button id="ep-test" data-i18n="editorTest"></button>
    <button id="ep-export" data-i18n="editorExport"></button>
    <button id="ep-import" data-i18n="editorImport"></button>
    <button id="ep-clear" data-i18n="editorClear"></button>
    <button id="ep-exit" data-i18n="editorExit"></button>
  </div>
</div>

<!-- ================= MENÚ ================= -->
<div class="overlay" id="menu">
  <h1>G E O D A</h1>
  <p class="tagline" data-i18n="tagline"></p>
  <div id="meta-row"></div>
  <div id="menu-columns">
    <div class="menu-col">
      <p id="menu-intro"></p>
      <h3 data-i18n="difficulty"></h3>
      <div id="difficulty-row"></div>
      <h3 data-i18n="mapTitle"></h3>
      <div id="layout-row"></div>
      <p id="layout-desc" style="font-size:11.5px; margin-top:6px; min-height:28px;"></p>
      <p id="record-row" style="font-size:12px; color:var(--gold);"></p>
      <div class="btn-row" style="margin-top:8px;">
        <button class="big-btn" id="start-btn" data-i18n="start"></button>
        <button class="big-btn gold hidden" id="continue-btn" data-i18n="cont"></button>
      </div>
      <div id="asc-row" class="hidden">
        <h3 data-i18n="ascTitle" style="margin-bottom:4px;"></h3>
        <div style="display:flex; gap:10px; align-items:center; justify-content:center;">
          <button class="diff-btn" id="asc-minus">−</button>
          <span id="asc-level" style="font-weight:800; min-width:26px;">0</span>
          <button class="diff-btn" id="asc-plus">+</button>
        </div>
        <p id="asc-desc" style="font-size:11.5px; margin-top:4px;"></p>
      </div>
      <div class="btn-row">
        <button class="big-btn gold" id="campaign-btn" data-i18n="campaignBtn"></button>
        <button class="big-btn secondary" id="daily-btn" data-i18n="daily"></button>
        <button class="big-btn secondary" id="code-btn" data-i18n="playCode"></button>
        <button class="big-btn secondary" id="editor-btn" data-i18n="editorBtn"></button>
        <button class="big-btn secondary" id="settings-btn" data-i18n="settings"></button>
      </div>
      <p id="daily-best-row" style="margin-top:8px; font-size:12px;"></p>
      <p id="menu-help-hint" style="margin-top:8px; font-size:12px;"></p>
      <h3 data-i18n="historyTitle"></h3>
      <div id="history-list"></div>
    </div>
    <div class="menu-col">
      <h3 data-i18n="shopTitle"></h3>
      <div id="shop-grid"></div>
      <h3 data-i18n="unlockTowers"></h3>
      <div id="unlock-grid"></div>
      <h3 id="ach-title"></h3>
      <div id="ach-grid"></div>
    </div>
  </div>
</div>

<!-- ================= PAUSA ================= -->
<div class="overlay hidden" id="paused" style="background: rgba(8,7,18,0.75);">
  <h2 style="letter-spacing:4px;" data-i18n="pause"></h2>
  <div class="btn-row">
    <button class="big-btn" id="resume-btn" data-i18n="resume"></button>
    <button class="big-btn secondary" id="restart-btn" data-i18n="restart"></button>
    <button class="big-btn secondary" id="tomenu-btn" data-i18n="menu"></button>
  </div>
</div>

<!-- ================= AYUDA ================= -->
<div class="overlay hidden" id="help">
  <h2 style="font-size:26px;" data-i18n="helpTitle"></h2>
  <div class="help-box" id="help-content"></div>
  <button class="big-btn" id="help-close" data-i18n="back"></button>
</div>

<!-- ================= AJUSTES ================= -->
<div class="overlay hidden" id="settings">
  <h2 style="font-size:26px;" data-i18n="settingsTitle"></h2>
  <div class="set-box" id="settings-box"></div>
  <div class="btn-row">
    <button class="big-btn secondary" id="export-btn" data-i18n="sExport"></button>
    <button class="big-btn secondary" id="import-btn" data-i18n="sImport"></button>
  </div>
  <button class="big-btn" id="settings-close" data-i18n="back"></button>
</div>

<!-- ================= DRAFT DE RELIQUIAS ================= -->
<div class="overlay hidden" id="draft">
  <h2 style="font-size:28px;" data-i18n="draftTitle"></h2>
  <p data-i18n="draftSub"></p>
  <div id="draft-cards"></div>
</div>

<!-- ================= CAMPAÑA ================= -->
<div class="overlay hidden" id="campaign">
  <h2 style="font-size:28px;" data-i18n="campaignTitle"></h2>
  <p data-i18n="campaignSub"></p>
  <div id="campaign-grid"></div>
  <button class="big-btn secondary" id="campaign-close" data-i18n="back"></button>
</div>

<!-- ================= DERROTA ================= -->
<div class="overlay hidden" id="gameover">
  <h2 data-i18n="defeat"></h2>
  <div class="stats-grid" id="final-stats"></div>
  <div class="chart-box"><div class="c-title" id="go-chart-title"></div><canvas id="go-chart" width="540" height="130"></canvas></div>
  <div class="dmg-bars" id="go-bars"></div>
  <div class="frags-earned" id="final-frags"></div>
  <div class="btn-row">
    <button class="big-btn" id="retry-btn" data-i18n="retry"></button>
    <button class="big-btn secondary" id="go-card-btn" data-i18n="saveCard"></button>
    <button class="big-btn secondary" id="go-code-btn" data-i18n="copyCode"></button>
    <button class="big-btn secondary" id="gomenu-btn" data-i18n="menu"></button>
  </div>
</div>

<!-- ================= VICTORIA ================= -->
<div class="overlay hidden" id="victory">
  <h2 id="victory-title" data-i18n="victoryT"></h2>
  <div id="victory-stars-row"></div>
  <p id="victory-sub" data-i18n="victoryP"></p>
  <div class="stats-grid" id="victory-stats"></div>
  <div class="chart-box"><div class="c-title" id="vic-chart-title"></div><canvas id="vic-chart" width="540" height="130"></canvas></div>
  <div class="dmg-bars" id="vic-bars"></div>
  <div class="frags-earned" id="victory-frags"></div>
  <div class="btn-row">
    <button class="big-btn gold" id="endless-btn" data-i18n="endless"></button>
    <button class="big-btn gold hidden" id="next-level-btn" data-i18n="nextLevel"></button>
    <button class="big-btn secondary" id="vic-card-btn" data-i18n="saveCard"></button>
    <button class="big-btn secondary" id="vic-code-btn" data-i18n="copyCode"></button>
    <button class="big-btn secondary" id="vmenu-btn" data-i18n="menu"></button>
  </div>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
